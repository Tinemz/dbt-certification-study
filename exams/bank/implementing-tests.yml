# Practice questions for Topic 05 -- Implementing dbt tests.
# Original questions written from exam/topics.yml + the vendored official docs.

- id: tst-001
  topic: "05"
  subskill: 05-01
  type: multiple-choice
  stem: >-
    A model contains a complex case-when with many branches plus date math. The team wants to
    validate the logic against handcrafted inputs before the model is ever built in production.
    Which kind of test fits?
  options:
    a: "A singular test, written as a SQL file that returns failing rows"
    b: "A generic not_null test applied to the output column"
    c: "A unit test, which validates SQL logic against static fixture inputs before materialization"
    d: "A source freshness check on the upstream tables"
  answer: [c]
  explanation: >-
    Data tests -- generic and singular -- can only run after a model is built, and they assess the
    resulting data. Unit tests validate modeling logic against a small set of static inputs before
    materializing the model, which is exactly what suits complex conditional logic and date math.
  docs_ref: website/docs/docs/build/unit-tests.md

- id: tst-002
  topic: "05"
  subskill: 05-01
  type: multiple-choice
  stem: >-
    A team needs the same non-standard assertion applied to columns across fifteen different
    models. What is the right implementation?
  options:
    a: "A singular test file per model, each with the model name hard-coded"
    b: "A custom generic test defined in a test block macro, then referenced by name in each model's YAML"
    c: "A unit test with fixtures covering all fifteen models"
    d: "Fifteen copies of an accepted_values test in schema.yml"
  answer: [b]
  explanation: >-
    A custom generic test is defined once as a parameterized test block and then applied by name to
    any model or column in YAML -- the DRY answer for a reusable assertion. Singular tests are
    one-off SQL files tied to a specific case, and unit tests validate logic against fixtures rather
    than asserting on built data.
  docs_ref: website/docs/best-practices/custom-generic-tests.md

- id: tst-003
  topic: "05"
  subskill: 05-02
  type: multiple-choice
  stem: >-
    A not_null test on a large incremental model scans the entire table on every run, which is
    expensive. Which test configuration limits the scanned data without weakening the assertion on
    new rows?
  options:
    a: "limit, capping the number of rows the test reads"
    b: "where, restricting the test to a recent slice of the data"
    c: "store_failures, reusing the previous run's failure table"
    d: "severity: warn, so the test no longer blocks the run"
  answer: [b]
  explanation: >-
    The where config adds a condition to the test query, so it can be scoped to recent partitions
    rather than the full history. store_failures persists failing rows for inspection but does not
    reduce what is scanned, and severity only changes how a failure is reported, not its cost.
  docs_ref: website/docs/reference/resource-configs/where.md

- id: tst-004
  topic: "05"
  subskill: 05-03
  type: multiple-choice
  stem: >-
    According to dbt's best-practice workflows, what is the minimum testing bar every model in a
    project should meet?
  options:
    a: "Every column should have a not_null test"
    b: "Every model should have a primary key tested for uniqueness and not null"
    c: "Every model should have at least one singular test written for it"
    d: "Only models consumed by exposures need tests"
  answer: [b]
  explanation: >-
    The recommended minimum is that every model has a primary key tested to be unique and not null.
    That catches grain and duplication errors, which are the failures most likely to silently
    corrupt downstream joins. Testing every single column is redundant and costly, and restricting
    tests to models behind exposures leaves the rest of the DAG unguarded.
  docs_ref: website/docs/best-practices/best-practice-workflows.md

- id: tst-005
  topic: "05"
  subskill: 05-01
  type: matching
  stem: Match each testing need to the dbt test type that addresses it.
  pairs:
    - left: Validate SQL logic against handcrafted inputs before the model is ever built
      right: Unit test
    - left: Assert a column has no nulls, declared by name in YAML
      right: Generic data test
    - left: A one-off assertion expressed as a SQL query returning failing rows
      right: Singular data test
    - left: A reusable parameterized assertion applied by name across many models
      right: Custom generic data test
  explanation: >-
    The decisive split is when they run. Unit tests validate modeling logic against static fixtures
    before materialization. All data tests -- generic, singular, and custom generic -- run against
    data after the model is built.
  docs_ref: website/docs/docs/build/unit-tests.md

- id: tst-006
  topic: "05"
  subskill: 05-01
  type: domc
  stem: >-
    For each statement about unit tests versus data tests, decide whether it is true.
  domc_options:
    - text: "Unit tests run against static fixture inputs you define, not against warehouse data"
      keyed: true
    - text: "Unit tests can catch a bug before the model is materialized in production"
      keyed: true
    - text: "Data tests, generic or singular, only run after the model has been built"
      keyed: true
    - text: "A generic not_null test can validate transformation logic before the model is built"
      keyed: false
    - text: "Unit tests are recommended for simple aggregations such as min() and max()"
      keyed: false
  explanation: >-
    Unit tests exist precisely to validate logic before materialization, which no data test can do.
    The docs explicitly discourage unit testing functions like min(), since the warehouse already
    tests those extensively and fixture data would not be informative.
  docs_ref: website/docs/docs/build/unit-tests.md

- id: tst-007
  topic: "05"
  subskill: 05-02
  type: fill-in-blank
  stem: >-
    Which test config restricts a data test to a subset of rows, so an expensive test on a large
    incremental model does not scan the full table? Type the config key.
  answer: ["where"]
  answer_note: case-insensitive
  explanation: >-
    The where config appends a condition to the test query, scoping it to a recent slice. limit does
    not exist as a test config, store_failures persists failures without reducing the scan, and
    severity only changes how a failure is reported.
  docs_ref: website/docs/reference/resource-configs/where.md

- id: tst-008
  topic: "05"
  subskill: 05-03
  type: build-list
  stem: >-
    Put these testing steps in the order they occur during a single dbt build of a staging model
    that feeds a mart.
  sequence:
    - "Unit tests on the staging model run against static fixtures"
    - "The staging model is materialized in the warehouse"
    - "Data tests on the staging model run against the built relation"
    - "The mart model builds, or is skipped if a staging test failed"
    - "Data tests on the mart run against the built mart"
  explanation: >-
    dbt build interleaves tests with models in DAG order, and unit tests run before materialization
    because they validate logic rather than data. A failing data test causes its downstream models
    to be skipped, which is the mechanism that stops bad data propagating.
  docs_ref: website/docs/reference/commands/build.md

- id: tst-009
  topic: "05"
  subskill: 05-01
  type: multiple-choice
  code: |
    unit_tests:
      - name: test_customer_flags
        model: dim_customers
        given:
          - input: ref('int_customer_base')   # ephemeral model
            format: dict
            rows:
              - {customer_id: 1, is_active: true}
        expect:
          rows:
            - {customer_id: 1, active_flag: 'Y'}
  code_lang: yaml
  stem: >-
    int_customer_base is materialized as ephemeral. What must change for this unit test to work?
  options:
    a: "Nothing; dict is the default format and works for any input"
    b: "Switch the input to format: sql and supply every column of int_customer_base"
    c: "Switch the input to format: csv and move the rows to tests/fixtures/"
    d: "Remove the input, since ephemeral models are inlined and need no mock"
  answer: [b]
  explanation: >-
    An input that is an ephemeral model must use format: sql. With format: sql, mock data must be
    supplied for all columns, unlike dict and csv, which accept only the relevant columns. Removing
    the input breaks the rule that every ref in the model must be declared as an input.
  docs_ref: website/docs/docs/build/unit-tests.md

- id: tst-010
  topic: "05"
  subskill: 05-01
  type: hotspot
  format_source: inferred
  code: |
    models:
      - name: fct_payments
        columns:
          - name: payment_id
            data_tests:
              - unique
              - not_null
          - name: amount
            data_tests:
              - assert_total_payment_amount_is_positive
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['paid', 'refunded']
  code_lang: yaml
  stem: >-
    The project has a singular test at tests/assert_total_payment_amount_is_positive.sql. dbt raises
    an error when parsing this YAML. Click the line responsible.
  answer_line: 10
  explanation: >-
    Singular tests run automatically on dbt test and must not be referenced in a model's YAML. They
    are not generic tests or macros, so listing one under data_tests raises an error. The
    accepted_values block is valid: its values are nested under arguments, as required from
    v1.10.5.
  docs_ref: website/docs/docs/build/data-tests.md

- id: tst-011
  topic: "05"
  subskill: 05-01
  type: fill-in-blank
  stem: >-
    A custom generic test is applied to a column of a source. Inside the test block, what is the
    name of the standard argument that receives the source's relation? Type the argument name.
  answer: ["model"]
  answer_note: case-insensitive
  explanation: >-
    The standard argument is always named model, even when the resource is a source, seed, or
    snapshot. The other standard argument is column_name. Both come from the YAML context and are
    not passed explicitly.
  docs_ref: website/docs/best-practices/custom-generic-tests.md

- id: tst-012
  topic: "05"
  subskill: 05-01
  type: domc
  stem: >-
    For each statement about defining unit tests in dbt Core 1.11, decide whether it is true.
  domc_options:
    - text: "Every ref and source the model uses should be declared as a given input"
      keyed: true
    - text: "If a seed input is omitted, the seed itself is used as the input"
      keyed: true
    - text: "An override of a macro applies even if the model only calls it indirectly, through another macro"
      keyed: false
    - text: "Unit test YAML definitions belong in the tests/ directory, next to singular tests"
      keyed: false
    - text: "With format: sql, you can mock only the columns relevant to the test"
      keyed: false
  explanation: >-
    Undeclared refs or sources cause "node not found" at compile, and an omitted seed falls back to
    the seed itself. Overrides apply only to macros, vars, and env vars referenced directly in the
    model. Unit test YAML must live under model-paths; tests/ is reserved for data tests. Only dict
    and csv allow partial columns; sql requires every column.
  docs_ref: website/docs/reference/resource-properties/unit-test-overrides.md

- id: tst-013
  topic: "05"
  subskill: 05-01
  type: matching
  stem: Match each file path to what dbt treats it as, in a project using default paths.
  pairs:
    - left: tests/generic/test_is_even.sql
      right: Custom generic test definition
    - left: tests/assert_no_negative_totals.sql
      right: Singular data test
    - left: tests/fixtures/orders_input.csv
      right: Unit test fixture file
    - left: models/marts/_unit_tests.yml
      right: Unit test definitions
  explanation: >-
    Under test-paths, the generic subfolder holds test blocks, the fixtures subfolder holds unit test
    fixture files, and a top-level .sql file is a singular test. Unit test YAML is discovered from
    model-paths, so it lives under models/, not tests/.
  docs_ref: website/docs/reference/resource-properties/data-formats.md

- id: tst-014
  topic: "05"
  subskill: 05-01
  type: multiple-choice
  stem: >-
    A unit test on an incremental model overrides is_incremental to true and mocks both
    ref('events') and this. What do the rows under expect represent?
  options:
    a: "The full contents of the table after the merge completes"
    b: "The rows the materialization will insert or merge into the table"
    c: "The rows already present in this before the run"
    d: "The rows of ref('events') that were filtered out by the incremental predicate"
  answer: [b]
  explanation: >-
    For an incremental model, expect is the result of the materialization -- what gets inserted or
    merged -- not the final table after the merge. dbt currently has no way to unit test that the
    merge itself was applied correctly.
  docs_ref: website/docs/docs/build/unit-tests.md

- id: tst-015
  topic: "05"
  subskill: 05-01
  type: multiple-choice
  code: |
    {% test warn_if_negative(model, column_name) %}
        {{ config(severity = 'warn') }}
        select * from {{ model }}
        where {{ column_name }} < 0
    {% endtest %}
  code_lang: sql
  stem: >-
    This test is applied to two columns. On column refund_amount it has no extra configuration. On
    column total_amount it sets config: {severity: error}. Both columns contain negative values.
    What happens?
  options:
    a: "Both tests warn, because the config() in the test block always wins"
    b: "Both tests error, because error is the dbt default severity"
    c: "refund_amount warns and total_amount errors"
    d: "dbt raises a parse error, because severity cannot be set in two places"
  answer: [c]
  explanation: >-
    A config() inside a generic test block sets the default for every instance of that test. An
    instance's own YAML configuration overrides the default. So the unconfigured instance inherits
    warn, and the instance configured with severity: error fails the run.
  docs_ref: website/docs/best-practices/custom-generic-tests.md

- id: tst-016
  topic: "05"
  subskill: 05-01
  type: multiple-choice
  stem: >-
    A unit test expects four output rows. Three of them come out with a different value than
    expected. How does dbt report this unit test?
  options:
    a: "FAIL 3, one failure per mismatched row"
    b: "FAIL 1, since a unit test is a single test case that either passes or fails"
    c: "WARN 3, since unit tests default to warn severity"
    d: "ERROR, since mismatched rows are treated as a compilation error"
  answer: [b]
  explanation: >-
    Each unit test is one test case, so its result is always pass (0) or fail (1), regardless of how
    many rows differ. Data tests are different: they report the number of failing records returned
    by the test query.
  docs_ref: website/docs/docs/build/unit-tests.md
