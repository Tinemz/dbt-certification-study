# Practice questions for Topic 02 -- Managing dbt models governance.
# Original questions written from exam/topics.yml + the vendored official docs.

- id: ctr-001
  topic: "02"
  subskill: 02-01
  type: multiple-choice
  stem: >-
    A team sets contract.enforced: true on a model but lists only the column names under columns:,
    without data_type. What happens when the model builds?
  options:
    a: "It builds normally -- data_type is optional and inferred from the compiled SQL"
    b: "It fails, because an enforced contract requires both name and data_type for every column"
    c: "It builds with a warning, and dbt backfills data_type into the manifest"
    d: "It fails only if the model is materialized as a view"
  answer: [b]
  explanation: >-
    When a contract is enforced, it must include every column's name and data_type, using a type
    the data platform understands. dbt verifies the model's transformation produces a dataset
    matching the contract before building, and fails the build otherwise.
  docs_ref: website/docs/docs/mesh/govern/model-contracts.md

- id: ver-001
  topic: "02"
  subskill: 02-02
  type: multiple-choice
  stem: >-
    Which change to a contracted model requires creating a new model version rather than editing
    the existing one in place?
  options:
    a: "Adding a new column to the model's output"
    b: "Fixing a bug in an existing column's calculation without changing its name or type"
    c: "Removing a column that downstream consumers currently select"
    d: "Adding a description to an existing column in the YAML"
  answer: [c]
  explanation: >-
    Removing or renaming a column, or changing its data type or nullability, breaks the contract's
    guarantees and warrants a new version. Non-breaking changes -- adding a column, fixing a
    calculation that preserves name and type, editing documentation -- do not require a version bump.
  docs_ref: website/docs/docs/mesh/govern/model-versions.md

- id: cns-001
  topic: "02"
  subskill: 02-03
  type: multiple-choice
  stem: >-
    A team adds a primary_key constraint to a model on Snowflake and expects the warehouse to
    reject duplicate values. What actually happens, and which config silences the resulting warning?
  options:
    a: "Snowflake enforces the constraint; no warning is produced"
    b: "The constraint is informational only and not enforced; warn_unenforced: False silences the warning"
    c: "The constraint is unsupported and omitted from the DDL; warn_unsupported: False silences the warning"
    d: "dbt enforces it in the compiled SQL by adding a distinct clause; no warning is produced"
  answer: [b]
  explanation: >-
    Most analytical platforms support and enforce only not_null; others, like primary_key on
    Snowflake, are supported but not enforced -- included in the templated DDL as informational
    metadata. warn_unenforced: False skips that warning. warn_unsupported: False is for constraints
    the platform does not support at all, such as check on Redshift, which are omitted from the DDL.
  docs_ref: website/docs/reference/resource-properties/constraints.md

- id: ctr-002
  topic: "02"
  subskill: 02-01
  type: multiple-choice
  code: |
    models:
      - name: dim_customers
        config:
          contract:
            enforced: true
        columns:
          - name: customer_id
          - name: customer_name
            data_type: varchar
  code_lang: yaml
  stem: >-
    This YAML accompanies a model materialized as a table. What happens on dbt run, and why?
  options:
    a: "It builds -- data_type is only required for columns carrying constraints"
    b: "It fails -- an enforced contract requires data_type on every column, and customer_id has none"
    c: "It builds with a warning that customer_id will not be type-checked"
    d: "It fails -- contracts cannot be declared under config:, only at the model's top level"
  answer: [b]
  explanation: >-
    When a contract is enforced it must include every column's name and data_type. customer_id
    declares only a name, so the contract is incomplete and the build fails. Declaring the contract
    under config: is correct syntax and not the problem here.
  docs_ref: website/docs/docs/mesh/govern/model-contracts.md

- id: ver-002
  topic: "02"
  subskill: 02-02
  type: build-list
  stem: >-
    A producer team needs to remove a column from a contracted model that several teams query. Put
    the model-versioning steps in the order the docs recommend.
  sequence:
    - "Develop the new version alongside the existing one"
    - "Bump latest_version so new ref() calls resolve to the new version"
    - "Set a deprecation_date on the old version to give consumers a migration window"
    - "Update downstream references to the new version"
    - "Remove the old version once the deprecation date passes"
  explanation: >-
    The documented pathway is develop, bump the latest, slate the old version for deprecation,
    let consumers migrate, then remove. The deprecation date is what puts a known boundary on the
    cost of migration -- removing the old version first would break consumers immediately.
  docs_ref: website/docs/docs/mesh/govern/model-versions.md

- id: ver-003
  topic: "02"
  subskill: 02-02
  type: domc
  stem: >-
    A model has an enforced contract. For each change presented, decide whether it requires
    creating a new model version.
  domc_options:
    - text: "Renaming an existing column"
      keyed: true
    - text: "Changing a column's data type from int to varchar"
      keyed: true
    - text: "Removing a column that downstream models select"
      keyed: true
    - text: "Adding a new column to the model's output"
      keyed: false
    - text: "Fixing a bug in a calculation without changing the column's name or type"
      keyed: false
    - text: "Adding a description to an existing column"
      keyed: false
  explanation: >-
    A new version is warranted when the change breaks the contract's guarantees: renaming,
    removing, or changing a column's type or nullability. Additive and cosmetic changes -- a new
    column, a corrected calculation that preserves name and type, documentation -- do not.
  docs_ref: website/docs/docs/mesh/govern/model-versions.md

- id: cns-002
  topic: "02"
  subskill: 02-03
  type: matching
  stem: Match each constraint situation to the correct dbt configuration response.
  pairs:
    - left: Supported by the platform but not enforced, e.g. primary_key on Snowflake
      right: "warn_unenforced: False -- constraint stays in the templated DDL"
    - left: Not supported by the platform at all, e.g. check on Redshift
      right: "warn_unsupported: False -- constraint is omitted from the DDL"
    - left: Supported and enforced on nearly every analytical platform
      right: "not_null -- the one constraint you can rely on being enforced"
    - left: Required before any constraint can be declared on a model
      right: "An enforced contract with data_type on every column"
  explanation: >-
    Most analytical platforms enforce only not_null. Others are either informational (supported,
    unenforced) or dropped entirely (unsupported), and the two warn_ flags silence each case
    separately. Constraints are only available on models with an enforced contract, materialized as
    table or incremental.
  docs_ref: website/docs/reference/resource-properties/constraints.md

- id: cns-003
  topic: "02"
  subskill: 02-03
  type: hotspot
  format_source: inferred
  code: |
    models:
      - name: dim_customers
        config:
          materialized: view
          contract:
            enforced: true
        columns:
          - name: customer_id
            data_type: integer
            constraints:
              - type: not_null
  code_lang: yaml
  stem: >-
    The not_null constraint here is never enforced by the platform. Click the line that explains why.
  answer_line: 4
  explanation: >-
    Line 4 materializes the model as a view. Constraints are only applied on models materialized as
    table or incremental, because they are expressed in the DDL that creates the relation. The
    contract itself is still enforced at build time -- it is the platform-level constraint that
    silently does nothing.
  docs_ref: website/docs/reference/resource-properties/constraints.md

- id: ver-004
  topic: "02"
  subskill: 02-02
  type: multiple-choice
  code: |
    models:
      - name: dim_customers
        latest_version: 2
        versions:
          - v: 3
          - v: 2
          - v: 1
  code_lang: yaml
  stem: >-
    A downstream model contains {{ ref('dim_customers') }} with no version argument. Which version
    does it resolve to, and how are the other two classified?
  options:
    a: "v3, because unpinned refs always resolve to the highest version identifier; v2 and v1 are old"
    b: "v2, because latest_version is set explicitly; v3 is prerelease and v1 is old"
    c: "v1, because unpinned refs resolve to the oldest supported version; v2 and v3 are prerelease"
    d: "The build fails -- a versioned model cannot be referenced without a version argument"
  answer: [b]
  explanation: >-
    Unpinned refs resolve to latest_version, not to the greatest identifier. The highest version
    wins only when latest_version is not declared. Versions above the latest are prerelease, versions
    below it are old, so v3 is prerelease and v1 is old.
  docs_ref: website/docs/reference/resource-properties/latest_version.md

- id: ver-005
  topic: "02"
  subskill: 02-02
  type: fill-in-blank
  stem: >-
    Which selector lists only the models in a project that are NOT versioned? Type the full
    selector value as it would be passed to --select.
  answer: ["version:none", "none"]
  answer_note: "case-insensitive; accepted with or without the version: prefix"
  explanation: >-
    The version method takes four values: latest, prerelease, old, and none. version:none selects
    models that are not versioned at all, which is the complement of the other three.
  docs_ref: website/docs/reference/node-selection/methods.md

- id: ver-006
  topic: "02"
  subskill: 02-02
  type: matching
  stem: Match each deprecation scenario to what dbt produces.
  pairs:
    - left: Parsing a project that defines a model with a deprecation_date
      right: "DeprecatedModel warning, raised for the producer"
    - left: Referencing a model whose deprecation_date has already passed
      right: "DeprecatedReference warning, raised for producer and consumers"
    - left: Referencing a model whose deprecation_date is in the future
      right: "UpcomingReferenceDeprecation warning, raised for producer and consumers"
    - left: Turning any of these warnings into a build failure
      right: "WARN_ERROR_OPTIONS, which promotes selected warnings to runtime errors"
  explanation: >-
    All three deprecation signals are warnings, differing in who sees them and whether the date has
    passed. None of them stops a build on its own -- only WARN_ERROR_OPTIONS promotes them to errors.
  docs_ref: website/docs/reference/resource-properties/deprecation_date.md

- id: ver-007
  topic: "02"
  subskill: 02-02
  type: domc
  stem: >-
    A model carries deprecation_date: 2026-01-01, a date that has already passed. For each
    statement, decide whether it is true.
  domc_options:
    - text: "Referencing the model produces a warning rather than an error"
      keyed: true
    - text: "dbt keeps building the model until it is disabled or removed from the project"
      keyed: true
    - text: "deprecation_date can be used on a model that has no versions declared"
      keyed: true
    - text: "dbt drops the model's relation from the warehouse once the date passes"
      keyed: false
    - text: "dbt skips the model during build once the date passes"
      keyed: false
    - text: "A dedicated node selection method exists to select models by deprecation_date"
      keyed: false
  explanation: >-
    A deprecation date is a communication mechanism, not an action. dbt warns, but keeps building
    the model and never drops its relation -- the same way it does not drop relations for deleted
    models. Deprecation works with or without model versions, and there is no selection syntax for
    it; the documented approach is dbt ls with --output json --output-keys.
  docs_ref: website/docs/reference/resource-properties/deprecation_date.md

- id: cns-004
  topic: "02"
  subskill: 02-03
  type: multiple-choice
  stem: >-
    A model on Postgres has a not_null constraint on customer_id and also a not_null test on the
    same column. A batch of rows arrives with customer_id null. What is the difference in outcome?
  options:
    a: "Both fail after the table is built; the constraint reports as a test failure alongside the test"
    b: "The constraint fails the write and rolls back, so the rows never land; the test would have flagged them only after the table was built"
    c: "The constraint drops the offending rows and lets the build succeed; the test then passes"
    d: "The test runs first and blocks the build, so the constraint never evaluates"
  answer: [b]
  explanation: >-
    A constraint is validated by the data platform as rows are written: the operation fails, is
    rolled back, and the invalid data never lands in the table. A dbt test is a query executed after
    the model is built, so the bad rows exist in the warehouse until the test reports them. dbt never
    silently drops offending rows.
  docs_ref: website/docs/reference/resource-properties/constraints.md

- id: cns-005
  topic: "02"
  subskill: 02-03
  type: fill-in-blank
  stem: >-
    On Snowflake, Redshift and BigQuery, exactly one constraint type is both definable and actually
    enforced by the platform. Name that constraint type.
  answer: ["not_null", "not null"]
  answer_note: case-insensitive
  explanation: >-
    Most analytical platforms support and enforce only not_null. primary_key, foreign_key and
    unique are definable on several of them but informational only, and check is not definable at
    all on Snowflake, Redshift or BigQuery. Transactional databases such as Postgres enforce the
    full ANSI set plus check.
  docs_ref: website/docs/reference/resource-properties/constraints.md

- id: cns-006
  topic: "02"
  subskill: 02-03
  type: multiple-choice
  code: |
    models:
      - name: fct_orders
        config:
          materialized: table
          contract:
            enforced: true
        columns:
          - name: order_id
            data_type: integer
            constraints:
              - type: primary_key
          - name: line_number
            data_type: integer
            constraints:
              - type: primary_key
  code_lang: yaml
  stem: >-
    The team wants a composite primary key over order_id and line_number. Why is this YAML wrong,
    and what is the fix?
  options:
    a: "Nothing is wrong -- dbt combines column-level primary_key constraints into a composite key"
    b: "Multiple primary_key constraints at the column level are not supported; declare one model-level constraint with columns: [order_id, line_number]"
    c: "Composite keys require a check constraint with an expression instead"
    d: "Each primary_key needs a name: property to disambiguate them at the column level"
  answer: [b]
  explanation: >-
    Defining multiple primary_key constraints at the column level is not supported. A constraint
    spanning more than one column belongs at the model level, where the columns: list names the
    columns it applies to. Single-column constraints are still recommended directly on the column.
  docs_ref: website/docs/reference/resource-properties/constraints.md

- id: ver-008
  topic: "02"
  subskill: 02-02
  type: build-list
  stem: >-
    A producer team must drop a column from a contracted model that several consumer teams query.
    Put the five steps in the order the docs prescribe, from first to last.
  sequence:
    - "Develop the new version alongside the existing one"
    - "Bump latest_version so unpinned ref() calls resolve to the new version"
    - "Set a deprecation_date on the old version to open the migration window"
    - "Update downstream references to the new version"
    - "Remove the old version once the deprecation date has passed"
  explanation: >-
    The docs state the pathway in one sentence: develop a new version, bump the latest, slate the
    old version for deprecation, update downstream references, and then remove the old version. The
    common error is updating downstream references before bumping latest_version and announcing the
    deprecation -- consumers cannot plan a migration that has not been announced, and the new
    version is not yet canonical for unpinned refs. Note what step 4 actually covers: unpinned
    ref('dim_customers') calls follow latest_version automatically and need no edit. The references
    that must be migrated by hand are the pinned ones -- ref('dim_customers', v=1), which consumers
    adopt precisely to survive the migration window -- plus cross-project refs and anything querying
    the _v1 relation outside dbt. Those pins are what blocks step 5.
  docs_ref: website/docs/docs/mesh/govern/model-versions.md

- id: ver-009
  topic: "02"
  subskill: 02-02
  type: multiple-choice
  stem: >-
    A model declares versions v1, v2 and v3, and sets latest_version: 1. How is each version
    classified, and what does an unpinned ref('dim_customers') return?
  options:
    a: "v1 old, v2 and v3 latest; the ref returns v3"
    b: "v1 is latest, v2 and v3 are prerelease; the ref returns v1"
    c: "v3 is latest, v1 and v2 are old; the ref returns v3"
    d: "v1 is latest, v2 and v3 are old; the ref returns v1"
  answer: [b]
  explanation: >-
    Versions above latest_version are prerelease; versions below it are old. With latest_version
    explicitly set to 1, both v2 and v3 sit above it and are prerelease, and the unpinned ref
    resolves to latest_version -- v1. The greatest identifier wins only when latest_version is not
    declared at all. This is the documented "v2 in early development and testing" scenario.
  docs_ref: website/docs/reference/resource-properties/latest_version.md

- id: ver-010
  topic: "02"
  subskill: 02-02
  type: fill-in-blank
  stem: >-
    A deprecation_date on dim_customers_v1 passed last month, but the relation is still being
    rebuilt in the warehouse every night and the team wants it to stop. Which model config do they
    set to make dbt stop building it? Type the config key.
  answer:
    - "enabled"
    - "enabled: false"
    - "config.enabled"
  answer_note: The value (false) is optional when grading; the key is what is being tested.
  explanation: >-
    A deprecation_date is a communication mechanism, not an action. dbt warns about the deprecated
    model but keeps building it and never drops its relation. Stopping the build takes enabled:
    false, or deleting the version from the project.
  docs_ref: website/docs/reference/resource-properties/deprecation_date.md

- id: ver-011
  topic: "02"
  subskill: 02-02
  type: domc
  stem: >-
    A team is deciding how to ship a change to a contracted, widely-queried model. For each
    statement, decide whether it is true on dbt Core 1.11.
  domc_options:
    - text: "Adding a new nullable column is a non-breaking change and does not require a new version"
      keyed: true
    - text: "Removing a column or changing its data type is a breaking change that warrants a new version"
      keyed: true
    - text: "Several versions of the same model can exist in the warehouse at the same time"
      keyed: true
    - text: "Creating a new version automatically drops the previous version's relation"
      keyed: false
    - text: "A model must declare versions before it can carry a deprecation_date"
      keyed: false
  explanation: >-
    Versioning exists for breaking changes -- removing or renaming a column, changing a data type or
    nullability. Non-breaking additions should be preferred and shipped in place. Multiple versions
    are materialized concurrently, which is the trade-off the docs call out explicitly, and nothing
    is dropped automatically. deprecation_date works with or without versions.
  docs_ref: website/docs/docs/mesh/govern/model-versions.md

- id: ver-012
  topic: "02"
  subskill: 02-02
  type: multiple-choice
  stem: >-
    A BI tool queries the table name dim_customers directly, outside dbt, and must always land on
    the current latest version. The project runs dbt Core 1.11. What is the documented approach?
  options:
    a: "Enable the latest_version_pointer config on the model"
    b: "A macro guarded on model.version == model.latest_version, invoked from an on-run-end hook to create the view"
    c: "Set alias: dim_customers on the latest version so it drops the _v suffix"
    d: "Nothing is needed -- dbt always creates an unsuffixed view alongside the versioned relations"
  answer: [b]
  explanation: >-
    latest_version_pointer is a 1.12+ config and is not available on 1.11. On 1.11 the docs show the
    do-it-yourself pattern: a macro that checks whether the model being built is the latest version
    and creates a view under the base name, called from an on-run-end hook. Versioned relations are
    aliased <model>_v<v> by default and dbt creates no unsuffixed view on its own.
  docs_ref: website/docs/docs/mesh/govern/model-versions.md

- id: ver-013
  topic: "02"
  subskill: 02-02
  type: matching
  stem: Match each deprecation warning to the situation that raises it.
  pairs:
    - left: DeprecatedModel
      right: Parsing a project that defines a model with a deprecation_date
    - left: DeprecatedReference
      right: Referencing a model whose deprecation_date has already passed
    - left: UpcomingReferenceDeprecation
      right: Referencing a model whose deprecation_date is still in the future
    - left: WARN_ERROR_OPTIONS
      right: Promoting any of these warnings into a runtime error
  explanation: >-
    The producer sees DeprecatedModel at parse time merely for defining the date. The two Reference
    warnings fire for consumers and producers alike, split by whether the date has passed. None of
    them fail the run on their own -- WARN_ERROR_OPTIONS is what turns a warning into an error.
  docs_ref: website/docs/reference/resource-properties/deprecation_date.md

- id: ver-014
  topic: "02"
  subskill: 02-02
  type: hotspot
  format_source: inferred
  stem: >-
    This YAML is meant to declare v1 of dim_customers with every top-level column except
    country_name. dbt raises an error on parse. Click the line responsible.
  code: |
    models:
      - name: dim_customers
        latest_version: 2
        columns:
          - name: customer_id
            data_type: int
          - name: country_name
            data_type: varchar
        versions:
          - v: 2
          - v: 1
            columns:
              - include: [customer_id]
                exclude: [country_name]
  code_lang: yaml
  answer_line: 13
  explanation: >-
    exclude is only valid when include is '*' or 'all' -- the default. Line 13 names an explicit
    include list, so the exclude on the following line has nothing to subtract from and dbt errors.
    Either use include '*' with exclude [country_name], or list the wanted columns in include and
    drop exclude entirely.
  docs_ref: website/docs/reference/resource-properties/versions.md
