# Practice questions for Topic 06 -- Implementing and maintaining external dependencies.
# Original questions written from exam/topics.yml + the vendored official docs.

- id: exp-001
  topic: "06"
  subskill: 06-01
  type: multiple-choice
  stem: >-
    A BI dashboard is built on fct_orders and dim_customers. The team wants dbt to know about this
    downstream consumer so they can run and test everything feeding it, and surface it in the docs
    site. What should they define, and how are its dependencies declared?
  options:
    a: "A source, with the dashboard listed under tables:"
    b: "An exposure, with depends_on listing ref() and source() calls"
    c: "A model with materialized: ephemeral that selects from both models"
    d: "A group, with the dashboard listed as an owner"
  answer: [b]
  explanation: >-
    Exposures define and describe a downstream use of the project such as a dashboard, application,
    or data science pipeline. They are declared under an exposures: key with depends_on listing
    ref(), source(), or metric() calls, which lets you select the upstream resources feeding them
    and gives them a dedicated page in the generated documentation.
  docs_ref: website/docs/docs/build/exposures.md

- id: frs-001
  topic: "06"
  subskill: 06-02
  type: multiple-choice
  stem: >-
    A source is configured with freshness warn_after 12 hours and error_after 24 hours. The most
    recent record is 30 hours old. What does dbt source freshness do?
  options:
    a: "Reports a warning and exits with code 0, since freshness never blocks a pipeline"
    b: "Reports an error for that source and exits with a nonzero exit code"
    c: "Skips the check because the source exceeded both thresholds and is considered stale-safe"
    d: "Rebuilds the downstream models to refresh the data automatically"
  answer: [b]
  explanation: >-
    dbt source freshness queries the source tables and compares the loaded_at_field against the
    configured thresholds. Past error_after, the source is in a stale state and dbt exits with a
    nonzero exit code -- which is what allows an orchestrator to halt the pipeline. It reports
    staleness; it never rebuilds data on its own.
  docs_ref: website/docs/reference/commands/source.md

- id: exp-002
  topic: "06"
  subskill: 06-01
  type: multiple-choice
  code: |
    exposures:
      - name: Weekly Jaffle Metrics
        type: dashboard
        maturity: high
        url: https://bi.tool/dashboards/1
        owner:
          name: Data Team
          email: data@example.com
        depends_on:
          - ref('fct_orders')
  code_lang: yaml
  stem: >-
    This exposure definition is rejected. What is wrong with it?
  options:
    a: "depends_on must list at least two resources"
    b: "The name contains spaces -- exposure names allow only letters, numbers and underscores"
    c: "maturity: high is not a valid value; only medium and low are allowed"
    d: "owner must include a Slack handle in addition to name and email"
  answer: [b]
  explanation: >-
    Exposure names must contain only letters, numbers, and underscores. A human-friendly string with
    spaces and title casing belongs in the label property instead. maturity accepts high, medium and
    low, and owner supports name and email only.
  docs_ref: website/docs/reference/exposure-properties.md

- id: exp-003
  topic: "06"
  subskill: 06-01
  type: fill-in-blank
  stem: >-
    An exposure name cannot contain spaces. Which property holds the human-friendly version of the
    name, with spaces and title casing, for display in the docs site? Type the property name.
  answer: ["label"]
  answer_note: case-insensitive; trailing colon optional
  explanation: >-
    label carries the display name. The name property is the machine identifier, restricted to
    letters, numbers and underscores, and is what selection syntax matches against.
  docs_ref: website/docs/reference/exposure-properties.md

- id: frs-002
  topic: "06"
  subskill: 06-02
  type: multiple-choice
  code: |
    sources:
      - name: jaffle_shop
        database: raw
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
          loaded_at_field: _etl_loaded_at
        tables:
          - name: orders
          - name: customers
            config:
              freshness: null
  code_lang: yaml
  stem: >-
    What is the effect of the configuration on the customers table?
  options:
    a: "customers inherits the source-level thresholds, because null is ignored for tables"
    b: "customers is excluded from freshness checks, overriding the source-level default"
    c: "The YAML fails to parse, because freshness cannot be null"
    d: "customers is checked but always reported as fresh"
  answer: [b]
  explanation: >-
    Freshness set at the source level acts as a default for its tables, and a table can override it.
    Setting it to null on a specific table opts that table out of the check -- useful for a
    reference table that legitimately does not change.
  docs_ref: website/docs/docs/build/sources.md

- id: frs-003
  topic: "06"
  subskill: 06-02
  type: build-list
  stem: >-
    An orchestrator should stop the pipeline when upstream data is stale. Put the steps in the order
    they happen.
  sequence:
    - "Declare freshness thresholds and loaded_at_field on the source in YAML"
    - "Run dbt source freshness as the first step of the pipeline"
    - "dbt queries each source table and compares its newest record against the thresholds"
    - "A source past error_after causes dbt to exit with a nonzero exit code"
    - "The orchestrator halts before the transformation models run"
  explanation: >-
    Freshness is a gate you place ahead of the build. dbt reports staleness and signals it through
    the exit code; acting on that signal is the orchestrator's job, since dbt never refreshes source
    data itself.
  docs_ref: website/docs/reference/commands/source.md

- id: exp-004
  topic: "06"
  subskill: 06-01
  type: matching
  stem: >-
    Match each exposure property to the rule that governs it.
  pairs:
    - left: "name"
      right: "Required; letters, numbers and underscores only"
    - left: "owner"
      right: "Required; at least one of name or email must be present"
    - left: "depends_on"
      right: "Expected rather than required; lists ref, source and metric nodes"
    - left: "label"
      right: "Optional; the property that may carry spaces and capital letters"
    - left: "maturity"
      right: "Optional; one of high, medium or low"
  explanation: >-
    The three required properties are name, type and owner. depends_on sits in the docs' expected
    tier, not the required one, which is why an exposure with no parents still parses. owner is
    satisfied by name or email alone. label exists precisely because name rejects spaces and
    special characters.
  docs_ref: website/docs/docs/build/exposures.md

- id: exp-005
  topic: "06"
  subskill: 06-01
  type: multiple-choice
  code: |
    exposures:
      - name: weekly_kpis
        type: dashboard
        maturity: high
        url: https://bi.tool/dashboards/7
        depends_on:
          - ref('fct_orders')
  code_lang: yaml
  stem: >-
    This exposure definition fails to parse. What is missing?
  options:
    a: "A description, which becomes mandatory once maturity is set"
    b: "The owner property, which is required and needs at least a name or an email"
    c: "A label, which url requires in order to render the docs-site link"
    d: "A second entry in depends_on, since an exposure must have more than one parent"
  answer: [b]
  explanation: >-
    name, type and owner are the three required properties, and this definition supplies only the
    first two. maturity, url, label and description are all optional, and depends_on has no minimum
    length -- it is not even in the required tier.
  docs_ref: website/docs/reference/exposure-properties.md

- id: exp-006
  topic: "06"
  subskill: 06-01
  type: domc
  stem: >-
    A team has just added exposures to their project. Decide whether each statement is true.
  domc_options:
    - text: "dbt run --select \"+exposure:weekly_kpis\" builds the resources that feed that exposure"
      keyed: true
    - text: "An exposure is a metadata node and is never materialized in the warehouse"
      keyed: true
    - text: "The exposure method needs the + operator to be useful, since it selects parents"
      keyed: true
    - text: "dbt build materializes exposures as views so BI tools can query them directly"
      keyed: false
    - text: "Setting url on an exposure creates the dashboard in the connected BI tool"
      keyed: false
  explanation: >-
    Exposures describe a downstream consumer; they carry no SQL and produce no relation. The
    exposure: selection method resolves to the exposure node itself, so the + prefix is what
    reaches the upstream resources that actually build. url only activates the View this exposure
    link on the generated docs site.
  docs_ref: website/docs/docs/build/exposures.md

- id: frs-004
  topic: "06"
  subskill: 06-02
  type: hotspot
  format_source: inferred
  code: |
    sources:
      - name: jaffle_shop
        config:
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 2, period: week}
          loaded_at_field: _etl_loaded_at
        tables:
          - name: orders
  code_lang: yaml
  stem: >-
    One line in this source definition uses a value dbt does not accept. Identify that line.
  answer_line: 6
  explanation: >-
    period accepts minute, hour or day only -- week is not a valid period. The threshold would have
    to be expressed as {count: 14, period: day}. Everything else here is valid for dbt 1.11, where
    freshness sits under config (since v1.9) and loaded_at_field sits under config (since v1.10).
  docs_ref: website/docs/reference/resource-properties/freshness.md

- id: frs-005
  topic: "06"
  subskill: 06-02
  type: fill-in-blank
  stem: >-
    A source-level freshness block applies to every table in the source, but one table must be left
    out of freshness checks entirely. Write the complete config line that excludes it, as it appears
    nested under that table's config key.
  answer: ["freshness: null", "freshness:null"]
  answer_note: case-insensitive; leading dash and surrounding quotes ignored
  explanation: >-
    The documented way to exclude a source or table is to set freshness explicitly to null at the
    level you want excluded. Omitting the block does not work, because the source-level block is
    inherited by every table beneath it.
  docs_ref: website/docs/reference/resource-properties/freshness.md

- id: frs-006
  topic: "06"
  subskill: 06-02
  type: build-list
  stem: >-
    Put the steps of a freshness-gated pipeline in the order dbt requires.
  sequence:
    - "Declare a freshness block with warn_after, error_after, or both on the source"
    - "Run dbt source freshness, which writes the current sources.json to the target directory"
    - "Check the exit code -- a stale source makes dbt exit nonzero"
    - "Run dbt build with source_status:fresher+ and --state pointing at the prior artifacts"
  explanation: >-
    A freshness block with neither warn_after nor error_after is not evaluated at all, so the
    declaration has to come first. source_status: compares the current sources.json against the one
    in --state, which means dbt source freshness must have run in this invocation to produce
    something to compare.
  docs_ref: website/docs/reference/commands/source.md
