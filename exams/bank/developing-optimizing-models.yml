- id: emp-003
  topic: "01"
  subskill: 01-12
  type: domc
  stem: >-
    For each statement about the --empty flag, decide whether it is true.
  domc_options:
    - text: "It limits refs and sources to zero rows while still executing the model SQL"
      keyed: true
    - text: "It is supported on run, build, snapshot and compile"
      keyed: true
    - text: "It is ignored when used on a Python model"
      keyed: true
    - text: "It causes dbt to skip data tests entirely"
      keyed: false
    - text: "It validates column data types without connecting to the warehouse"
      keyed: false
  explanation: >-
    The flag limits input rows but still runs the SQL against the warehouse -- that execution is
