- id: mat-002
  topic: "01"
  subskill: 01-02
  type: matching
  stem: Match each materialization to the consequence that most distinguishes it.
  pairs:
    - left: view
      right: No stored rows; recomputed on every read
    - left: table
      right: Fully rebuilt each run; fastest to query
    - left: incremental
      right: Built once, then only new or changed rows are processed
    - left: ephemeral
      right: No warehouse object at all; inlined as a CTE into each consumer
  explanation: >-
    The distinguishing axis is what ends up in the warehouse and when it is computed. Ephemeral is
    the outlier: because no relation exists, it cannot be selected directly or have data tests run
    against it.
  docs_ref: website/docs/docs/build/materializations.md

- id: mod-002
  topic: "01"
  subskill: 01-03
  type: multiple-choice
  stem: >-
    According to dbt's guidance, which situation is the strongest signal that a CTE should be
    extracted into its own model?
  options:
    a: "The CTE contains more than twenty lines of SQL"
    b: "The CTE changes the grain of the data it selects from"
    c: "The CTE references a source rather than another model"
    d: "The CTE uses a window function"
  answer: [b]
  explanation: >-
    A CTE that changes the grain -- what one record represents -- is worth isolating precisely so
    the transformation can be tested independently. Duplication across models and sheer length are
    also cited as reasons, but a grain change is the one that carries a correctness risk.
  docs_ref: website/docs/best-practices/best-practice-workflows.md

- id: cmd-001
  topic: "01"
  subskill: 01-04
  type: matching
  stem: Match each command to what it does.
  pairs:
    - left: dbt build
      right: Runs models, tests, snapshots and seeds interleaved in DAG order
    - left: dbt compile
      right: Renders Jinja into SQL without executing it against the warehouse
    - left: dbt show
      right: Previews a model's result set without materializing it
    - left: dbt seed
      right: Loads CSV files from the seeds directory into the warehouse
  explanation: >-
    The pair most often confused is build versus run: build additionally runs tests, snapshots and
    seeds, interleaved so that a test failure skips its dependents. compile and show both avoid
    materializing, but only show returns rows.
  docs_ref: website/docs/reference/commands/build.md

- id: dag-002
  topic: "01"
  subskill: 01-05
  type: build-list
  stem: >-
    Put these models in the order dbt will build them, given that each uses ref() for its
    dependencies.
  sequence:
    - "stg_orders, selecting from a source"
    - "int_orders_joined, selecting from stg_orders"
    - "fct_orders, selecting from int_orders_joined"
    - "An exposure depending on fct_orders"
  explanation: >-
    dbt topologically sorts the DAG from ref() and source() calls, so a model never builds before
    its parents. Exposures are not built at all -- they sit at the end of the graph as declared
    consumers, which is what lets you select everything feeding them.
  docs_ref: website/docs/reference/dbt-jinja-functions/ref.md

- id: cfg-002
  topic: "01"
  subskill: 01-06
  type: hotspot
  format_source: inferred
  code: |
    models:
      my_project:
        +materialized: view
        staging:
          +materialized: view
          +schema: staging
        marts:
          materialized: table
          +schema: marts
  code_lang: yaml
  stem: >-
    Models in marts/ are not being built as tables. Click the line responsible.
  answer_line: 8
  explanation: >-
    Line 8 is missing the + prefix. Without it, dbt reads materialized as a folder name rather than
    a config key, so the setting is ignored and marts models fall back to the project-level view on
    line 3. Every other config in this file uses the prefix correctly.
  docs_ref: website/docs/reference/dbt_project.yml.md

- id: pkg-002
  topic: "01"
  subskill: 01-07
  type: fill-in-blank
  stem: >-
    After adding a package to packages.yml, which command installs it before the project can use its
    macros? Type the command including dbt.
  answer: ["dbt deps", "deps"]
  answer_note: case-insensitive
  explanation: >-
    dbt deps resolves packages.yml and installs into dbt_packages/. Until it runs, any macro or
