- id: mb-002
  topic: "01"
  subskill: 01-14
  type: build-list
  stem: >-
    Put the steps for converting a large time-series model to the microbatch strategy in order.
  sequence:
    - "Identify the column that timestamps each event"
    - "Set event_time on the model and on every upstream model that should be filtered"
    - "Set incremental_strategy to microbatch and choose a batch_size"
    - "Run the model so dbt splits processing into time-bounded batches"
    - "Retry or backfill individual batches independently as needed"
  explanation: >-
    event_time is the prerequisite: microbatch filters only the refs that declare it, so an upstream
    model without it gets a full scan on every batch. Because each batch is atomic and idempotent,
    dbt can build, retry and backfill them separately.
  docs_ref: website/docs/docs/build/incremental-microbatch.md

- id: mb-003
  topic: "01"
  subskill: 01-14
  type: multiple-choice
  stem: >-
    How does event_time differ from partition_by in a microbatch model?
  options:
    a: "They are synonyms; partition_by is the older name for event_time"
    b: "event_time defines time ranges used to filter rows into batches; partition_by groups rows into storage partitions"
    c: "event_time applies to the model, partition_by applies to its upstream sources"
    d: "partition_by is required whenever event_time is set"
  answer: [b]
  explanation: >-
    The docs call this out explicitly because it is easy to conflate. event_time is the time column
    microbatch uses to bound each batch; partition_by is a platform storage concern that groups rows
    into partitions. Setting one does not imply the other.
  docs_ref: website/docs/docs/build/incremental-microbatch.md
